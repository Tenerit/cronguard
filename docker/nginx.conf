# ─── nginx.conf — CronGuard reverse proxy ────────────────────────────────────
# Utilisé pour déploiement sur VPS (Hetzner, OVH...)
# Caddy est plus simple : voir Caddyfile plus bas

worker_processes auto;
events { worker_connections 1024; }

http {
  # ── Logs ────────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Sécurité globale ─────────────────────────────────────────────────────────
  server_tokens       off;
  client_max_body_size 256k;
  keepalive_timeout   65;

  # ── Rate limiting ─────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=ping:10m rate=120r/m;

  # ── Upstream ──────────────────────────────────────────────────────────────────
  upstream cronguard_api {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name cronguard.io www.cronguard.io;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name cronguard.io;

    ssl_certificate     /etc/letsencrypt/live/cronguard.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cronguard.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Ping endpoint (rate limit dédié, plus permissif) ──────────────────────
    location ~ ^/ping/ {
      limit_req zone=ping burst=20 nodelay;
      proxy_pass         http://cronguard_api;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # ── Webhook Stripe (pas de rate limit — Stripe a des IPs fixes) ───────────
    location /webhooks/ {
      proxy_pass         http://cronguard_api;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Raw body requis pour vérif signature Stripe
      proxy_request_buffering off;
    }

    # ── Reste de l'API ────────────────────────────────────────────────────────
    location / {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://cronguard_api;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
