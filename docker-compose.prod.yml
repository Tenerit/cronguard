services:

  api:
    image: ghcr.io/${GITHUB_REPO}/cronguard:latest
    command: node dist/api/index.js
    ports:
      - "3000:3000"
    env_file: .env.prod
    restart: always
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }

  worker:
    image: ghcr.io/${GITHUB_REPO}/cronguard:latest
    command: node dist/workers/analysis.worker.js
    env_file: .env.prod
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }

  checker:
    image: ghcr.io/${GITHUB_REPO}/cronguard:latest
    command: node dist/workers/timeout.checker.js
    env_file: .env.prod
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronguard}"]
      interval: 10s
      retries:  5
    # Pas de port exposé en prod — accessible uniquement depuis les services internes
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries:  5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # Nginx reverse proxy avec rate limiting et HTTPS
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  default:
    name: cronguard_prod
